<!-- @dsCard group="Brand" viewport="700x250" name="Primary logo" subtitle="Full-colour TIGNA — purple cat, yellow eyes, black GRUSP. The default." -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; background: var(--surface-card); padding: 28px; font-family: var(--font-body); display: flex; gap: 40px; align-items: center; }
  .primary { text-align: center; }
  .primary img { height: 178px; display: block; }
  .alt { flex: 1; }
  .alt__frame { background: var(--grusp-yellow); border-radius: var(--radius-md); padding: 20px 22px; display: inline-block; }
  .alt__frame img { height: 74px; display: block; }
  .cap { font-family: var(--font-mono); font-size: 10px; color: var(--text-muted); margin-top: 10px; }
  p { font-size: 13.5px; color: var(--text-body); line-height: 1.5; margin: 14px 0 0; max-width: 30em; }
</style>
</head>
<body>
  <div class="primary">
    <img src="../assets/logos/grusp-squared.png" alt="GrUSP primary full-colour logo" />
    <div class="cap">stacked · primary · full colour</div>
  </div>
  <div class="alt">
    <div class="alt__frame"><img src="../assets/logos/grusp-wordmark.png" alt="Grusp calligraphic full-colour logo" /></div>
    <div class="cap">calligraphic · full-colour alternate</div>
    <p>The full-colour mark — the purple <strong>TIGNA</strong> cat with yellow eyes — is the <strong>primary logo</strong>. Use it wherever colour is available. The calligraphic script is its playful alternate.</p>
  </div>
</body>
</html>
