<!-- @dsCard group="Brand" viewport="700x200" name="Logo on backgrounds" subtitle="Reversed & grayscale lockups for every surface" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; background: var(--surface-card); padding: 22px; font-family: var(--font-body); display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; }
  .tile { border-radius: var(--radius-md); height: 130px; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .tile img { max-width: 86%; max-height: 76%; }
  .cap { font-family: var(--font-mono); font-size: 10px; color: var(--text-muted); margin-top: 7px; text-align: center; }
  .onwhite { background: #fff; border: 1px solid var(--border-default); }
  .onyellow { background: var(--grusp-yellow); }
  .ondark { background: var(--grusp-black); }
</style>
</head>
<body>
  <div>
    <div class="tile onwhite"><img src="../assets/logos/grusp-grey-h.png" alt="grayscale logo" /></div>
    <div class="cap">grayscale</div>
  </div>
  <div>
    <div class="tile onyellow"><img src="../assets/logos/header-grusp-yellow.png" alt="logo on yellow" style="max-width:100%;max-height:100%;object-fit:cover;width:100%;height:100%" /></div>
    <div class="cap">heritage on yellow</div>
  </div>
  <div>
    <div class="tile ondark"><img src="../assets/logos/header-grusp-dark.png" alt="logo on dark" style="max-width:100%;max-height:100%;object-fit:cover;width:100%;height:100%" /></div>
    <div class="cap">heritage on black</div>
  </div>
</body>
</html>
