<!-- @dsCard group="Type" viewport="700x230" name="Display — Grota Rounded" subtitle="The brand face. Rounded, bold, friendly. Used for all headings." -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; background: var(--surface-card); padding: 26px 24px; font-family: var(--font-display); color: var(--text-strong); }
  .big { font-weight: 900; font-size: 64px; line-height: .98; letter-spacing: -.03em; margin: 0; }
  .mid { font-weight: 700; font-size: 30px; line-height: 1.1; margin: 14px 0 0; }
  .meta { font-family: var(--font-mono); font-size: 11px; color: var(--text-muted); margin-top: 16px; letter-spacing: .04em; }
  .w { display: flex; gap: 18px; margin-top: 12px; font-size: 22px; align-items: baseline; }
  .w span { color: var(--text-muted); font-size: 11px; font-family: var(--font-mono); margin-left: 4px; }
</style>
</head>
<body>
  <p class="big">Grumpy by name.</p>
  <p class="mid">Friendly by nature — since 2003.</p>
  <div class="w">
    <span style="font-family:var(--font-display)">Aa<span>300</span></span>
    <span style="font-weight:400;font-family:var(--font-display)">Aa<span>400</span></span>
    <span style="font-weight:700;font-family:var(--font-display)">Aa<span>700</span></span>
    <span style="font-weight:800;font-family:var(--font-display)">Aa<span>800</span></span>
    <span style="font-weight:900;font-family:var(--font-display)">Aa<span>900</span></span>
  </div>
  <div class="meta">Grota Rounded · Thin 100 · Light 300 · Regular 400 · Bold 700 · ExtraBold 800 · Black 900</div>
</body>
</html>
