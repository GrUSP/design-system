<!-- @dsCard group="Brand" viewport="700x230" name="Monochrome logo" subtitle="Black 'yellow-eyes' lockups — for single-colour / b&w sites" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; background: var(--surface-card); padding: 28px; font-family: var(--font-body); display: flex; gap: 36px; align-items: center; }
  .stacked img { height: 150px; display: block; }
  .horiz { display: flex; flex-direction: column; gap: 18px; flex: 1; }
  .horiz img { height: 48px; display: block; }
  .cap { font-family: var(--font-mono); font-size: 10px; color: var(--text-muted); margin-top: 8px; }
  p { font-size: 13.5px; color: var(--text-body); line-height: 1.5; margin: 6px 0 0; max-width: 26em; }
</style>
</head>
<body>
  <div class="stacked">
    <img src="../assets/logos/grusp-primary-stacked.png" alt="GrUSP monochrome stacked logo" />
    <div class="cap">stacked · single colour</div>
  </div>
  <div class="horiz">
    <div><img src="../assets/logos/grusp-primary-h-catleft.png" alt="GrUSP monochrome horizontal cat left" /><div class="cap">horizontal · cat left (sx)</div></div>
    <div><img src="../assets/logos/grusp-primary-h-catright.png" alt="GrUSP monochrome horizontal cat right" /><div class="cap">horizontal · cat right (dx)</div></div>
    <p>The black "yellow-eyes" lockup is the <strong>monochrome / single-colour</strong> version — for b&amp;w contexts or one-colour sites where the full-colour primary can't sit cleanly.</p>
  </div>
</body>
</html>
