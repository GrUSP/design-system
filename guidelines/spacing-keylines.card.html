<!-- @dsCard group="Spacing" viewport="700x160" name="Keylines" subtitle="The heavy black outline is a core GrUSP motif" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; background: var(--surface-card); padding: 26px 24px; font-family: var(--font-body); display: flex; gap: 22px; align-items: center; }
  .item { text-align: center; }
  .box { width: 96px; height: 56px; background: var(--surface-card); border-radius: var(--radius-md); border-style: solid; border-color: var(--grusp-black); }
  .n { font-family: var(--font-mono); font-size: 10px; color: var(--text-muted); margin-top: 8px; }
</style>
</head>
<body>
  <div class="item"><div class="box" style="border-width:var(--border-hair)"></div><div class="n">hair · 1</div></div>
  <div class="item"><div class="box" style="border-width:var(--border-base)"></div><div class="n">base · 2</div></div>
  <div class="item"><div class="box" style="border-width:var(--border-bold)"></div><div class="n">bold · 3</div></div>
  <div class="item"><div class="box" style="border-width:var(--border-chunky)"></div><div class="n">chunky · 4</div></div>
  <div class="item"><div class="box" style="border-width:var(--border-chunky);box-shadow:var(--offset-sm)"></div><div class="n">chunky + offset</div></div>
</body>
</html>
