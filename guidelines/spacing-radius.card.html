<!-- @dsCard group="Spacing" viewport="700x170" name="Radius" subtitle="Soft, rounded corners echoing the Grota letterforms" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; background: var(--surface-card); padding: 24px; font-family: var(--font-body); }
  .row { display: flex; gap: 18px; align-items: flex-end; }
  .item { text-align: center; }
  .box { width: 78px; height: 60px; background: var(--purple-100); border: 2px solid var(--grusp-purple-deep); }
  .n { font-family: var(--font-mono); font-size: 10px; color: var(--text-muted); margin-top: 8px; }
</style>
</head>
<body>
  <div class="row">
    <div class="item"><div class="box" style="border-radius:var(--radius-xs)"></div><div class="n">xs · 4</div></div>
    <div class="item"><div class="box" style="border-radius:var(--radius-sm)"></div><div class="n">sm · 8</div></div>
    <div class="item"><div class="box" style="border-radius:var(--radius-md)"></div><div class="n">md · 14</div></div>
    <div class="item"><div class="box" style="border-radius:var(--radius-lg)"></div><div class="n">lg · 20</div></div>
    <div class="item"><div class="box" style="border-radius:var(--radius-xl)"></div><div class="n">xl · 28</div></div>
    <div class="item"><div class="box" style="border-radius:var(--radius-2xl)"></div><div class="n">2xl · 40</div></div>
    <div class="item"><div class="box" style="width:60px;border-radius:var(--radius-pill)"></div><div class="n">pill</div></div>
  </div>
</body>
</html>
