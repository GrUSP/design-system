<!-- @dsCard group="Brand" viewport="700x180" name="Graphic motifs" subtitle="Yellow marker, swash underline & mono kicker" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; background: var(--surface-card); padding: 28px 26px; font-family: var(--font-body); }
  .kick { font-family: var(--font-mono); font-weight: 700; font-size: 12px; text-transform: uppercase; letter-spacing: .14em; color: var(--grusp-purple-deep); margin-bottom: 14px; }
  .line { font-family: var(--font-display); font-weight: 900; font-size: 32px; color: var(--text-strong); line-height: 1.25; margin: 0; }
</style>
</head>
<body>
  <div class="kick">// since 2003</div>
  <p class="line">Web dev that feels like a <span class="grusp-mark">community</span>,</p>
  <p class="line">not just a <span class="grusp-underline">conference</span>.</p>
</body>
</html>
