<!-- @dsCard group="Spacing" viewport="700x160" name="Spacing scale" subtitle="8px base grid, space-1 → space-12" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; background: var(--surface-card); padding: 22px 24px; font-family: var(--font-body); }
  .row { display: flex; align-items: flex-end; gap: 16px; }
  .item { text-align: center; }
  .bar { background: var(--grusp-purple); border-radius: var(--radius-xs); width: 26px; }
  .n { font-family: var(--font-mono); font-size: 10px; color: var(--text-muted); margin-top: 6px; }
  .px { font-family: var(--font-mono); font-size: 9px; color: var(--ink-400); }
</style>
</head>
<body>
  <div class="row">
    <div class="item"><div class="bar" style="height:8px"></div><div class="n">1</div><div class="px">4</div></div>
    <div class="item"><div class="bar" style="height:16px"></div><div class="n">2</div><div class="px">8</div></div>
    <div class="item"><div class="bar" style="height:24px"></div><div class="n">3</div><div class="px">12</div></div>
    <div class="item"><div class="bar" style="height:32px"></div><div class="n">4</div><div class="px">16</div></div>
    <div class="item"><div class="bar" style="height:48px"></div><div class="n">5</div><div class="px">24</div></div>
    <div class="item"><div class="bar" style="height:64px"></div><div class="n">6</div><div class="px">32</div></div>
    <div class="item"><div class="bar" style="height:80px"></div><div class="n">7</div><div class="px">40</div></div>
    <div class="item"><div class="bar" style="height:96px"></div><div class="n">8</div><div class="px">48</div></div>
  </div>
</body>
</html>
