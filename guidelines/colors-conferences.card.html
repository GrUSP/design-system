<!-- @dsCard group="Colors" viewport="700x215" name="Conference accents" subtitle="Each GrUSP event ships its own accent — pair with black & white" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; background: var(--surface-card); padding: 22px; font-family: var(--font-body); }
  .grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px; }
  .sw { text-align: left; }
  .chip { height: 52px; border-radius: var(--radius-sm); border: 2px solid var(--grusp-black); }
  .name { font-weight: 700; font-size: 11.5px; color: var(--text-strong); margin-top: 7px; }
  .hex { font-family: var(--font-mono); font-size: 10px; color: var(--text-muted); }
</style>
</head>
<body>
  <div class="grid">
    <div class="sw"><div class="chip" style="background:var(--c-phpday)"></div><div class="name">phpday</div><div class="hex">#6181B6</div></div>
    <div class="sw"><div class="chip" style="background:var(--c-jsday)"></div><div class="name">jsday</div><div class="hex">#4C3E8B</div></div>
    <div class="sw"><div class="chip" style="background:var(--c-reactjsday)"></div><div class="name">reactjsday</div><div class="hex">#30AADE</div></div>
    <div class="sw"><div class="chip" style="background:var(--c-vueday)"></div><div class="name">vueday</div><div class="hex">#41B883</div></div>
    <div class="sw"><div class="chip" style="background:var(--c-angularday)"></div><div class="name">angularday</div><div class="hex">#DD0031</div></div>
    <div class="sw"><div class="chip" style="background:var(--c-cssday)"></div><div class="name">cssday</div><div class="hex">#40BFEF</div></div>
    <div class="sw"><div class="chip" style="background:var(--c-containerday)"></div><div class="name">containerday</div><div class="hex">#F7941E</div></div>
    <div class="sw"><div class="chip" style="background:var(--c-kerning)"></div><div class="name">kerning</div><div class="hex">#E13423</div></div>
    <div class="sw"><div class="chip" style="background:var(--c-idi)"></div><div class="name">idi</div><div class="hex">#237D26</div></div>
    <div class="sw"><div class="chip" style="background:var(--c-vueday-ink)"></div><div class="name">vueday ink</div><div class="hex">#35495E</div></div>
    <div class="sw"><div class="chip" style="background:var(--c-reactjsday-2)"></div><div class="name">react alt</div><div class="hex">#5B59A2</div></div>
    <div class="sw"><div class="chip" style="background:var(--grusp-black)"></div><div class="name">sfday</div><div class="hex">#000000</div></div>
  </div>
</body>
</html>
