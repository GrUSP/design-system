<!-- @dsCard group="Type" viewport="700x300" name="Type scale" subtitle="Modular scale from micro labels to poster display" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; background: var(--surface-card); padding: 22px 24px; font-family: var(--font-display); color: var(--text-strong); }
  .r { display: flex; align-items: baseline; gap: 16px; padding: 5px 0; border-bottom: 1px solid var(--border-muted); }
  .r:last-child { border: none; }
  .lbl { font-family: var(--font-mono); font-size: 10px; color: var(--text-muted); width: 96px; flex: none; letter-spacing: .03em; }
  .t { font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
</style>
</head>
<body>
  <div class="r"><span class="lbl">5xl · 88</span><span class="t" style="font-size:46px;font-weight:900">Hero</span></div>
  <div class="r"><span class="lbl">4xl · 64</span><span class="t" style="font-size:40px;font-weight:900">Display</span></div>
  <div class="r"><span class="lbl">3xl · 48</span><span class="t" style="font-size:34px">Heading 1</span></div>
  <div class="r"><span class="lbl">2xl · 36</span><span class="t" style="font-size:27px">Heading 2</span></div>
  <div class="r"><span class="lbl">xl · 28</span><span class="t" style="font-size:23px;font-weight:700">Heading 3</span></div>
  <div class="r"><span class="lbl">md · 18</span><span class="t" style="font-size:18px;font-weight:400;font-family:var(--font-body)">Lead body — Proxima Nova</span></div>
  <div class="r"><span class="lbl">base · 16</span><span class="t" style="font-size:16px;font-weight:400;font-family:var(--font-body)">Body base — Proxima Nova</span></div>
  <div class="r"><span class="lbl">xs · 12</span><span class="t" style="font-size:12px;font-weight:700;font-family:var(--font-mono);letter-spacing:.12em;text-transform:uppercase">Kicker / Label</span></div>
</body>
</html>
