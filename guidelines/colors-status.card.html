<!-- @dsCard group="Colors" viewport="700x150" name="Status" subtitle="Semantic feedback colors with soft tints" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; background: var(--surface-card); padding: 22px; font-family: var(--font-body); }
  .row { display: flex; gap: 14px; }
  .sw { flex: 1; }
  .chip { height: 56px; border-radius: var(--radius-md) var(--radius-md) 0 0; }
  .tint { height: 26px; border-radius: 0 0 var(--radius-md) var(--radius-md); border: 1px solid rgba(0,0,0,.06); border-top: none; }
  .name { font-weight: 700; font-size: 13px; color: var(--text-strong); margin-top: 9px; }
  .hex { font-family: var(--font-mono); font-size: 11px; color: var(--text-muted); }
</style>
</head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:var(--success)"></div><div class="tint" style="background:var(--success-soft)"></div><div class="name">Success</div><div class="hex">#2E9E6B</div></div>
    <div class="sw"><div class="chip" style="background:var(--warning)"></div><div class="tint" style="background:var(--warning-soft)"></div><div class="name">Warning</div><div class="hex">#E6A700</div></div>
    <div class="sw"><div class="chip" style="background:var(--danger)"></div><div class="tint" style="background:var(--danger-soft)"></div><div class="name">Danger</div><div class="hex">#D6453F</div></div>
    <div class="sw"><div class="chip" style="background:var(--info)"></div><div class="tint" style="background:var(--info-soft)"></div><div class="name">Info</div><div class="hex">#4C3E8B</div></div>
  </div>
</body>
</html>
