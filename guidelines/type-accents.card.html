<!-- @dsCard group="Type" viewport="700x180" name="Accents — Condensed & Mono" subtitle="Proxima Condensed for stats · JetBrains Mono for kickers & code" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; background: var(--surface-card); padding: 24px; font-family: var(--font-body); display: flex; gap: 34px; align-items: center; }
  .stat { font-family: var(--font-cond); font-weight: 800; font-size: 66px; line-height: .9; color: var(--text-strong); letter-spacing: -.01em; }
  .stat small { display: block; font-family: var(--font-body); font-weight: 700; font-size: 13px; letter-spacing: .02em; color: var(--text-muted); margin-top: 4px; }
  .col { display: flex; flex-direction: column; gap: 12px; }
  .kick { font-family: var(--font-mono); font-weight: 700; font-size: 12px; text-transform: uppercase; letter-spacing: .14em; color: var(--grusp-purple-deep); }
  .code { font-family: var(--font-mono); font-size: 13px; background: var(--ink-950); color: var(--grusp-yellow); padding: 10px 14px; border-radius: var(--radius-sm); }
</style>
</head>
<body>
  <div class="stat">23<small>EVENTS / YEAR</small></div>
  <div class="stat">20+<small>YEARS</small></div>
  <div class="col">
    <div class="kick">// call for papers open</div>
    <div class="code">npm&nbsp;run&nbsp;grusp&nbsp;--save</div>
  </div>
</body>
</html>
