<!-- @dsCard group="Colors" viewport="700x190" name="Brand core" subtitle="Black · Yellow · White · two purples — the master palette" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; background: var(--surface-card); padding: 22px; font-family: var(--font-body); }
  .row { display: flex; gap: 14px; }
  .sw { flex: 1; }
  .chip { height: 86px; border-radius: var(--radius-md); border: 2px solid var(--grusp-black); }
  .name { font-weight: 700; font-size: 13px; color: var(--text-strong); margin-top: 9px; }
  .hex { font-family: var(--font-mono); font-size: 11px; color: var(--text-muted); letter-spacing: .02em; }
</style>
</head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:#000000"></div><div class="name">Black</div><div class="hex">#000000</div></div>
    <div class="sw"><div class="chip" style="background:#ffe900"></div><div class="name">Yellow</div><div class="hex">#FFE900</div></div>
    <div class="sw"><div class="chip" style="background:#ffffff"></div><div class="name">White</div><div class="hex">#FFFFFF</div></div>
    <div class="sw"><div class="chip" style="background:#7f72b1"></div><div class="name">Purple</div><div class="hex">#7F72B1</div></div>
    <div class="sw"><div class="chip" style="background:#4c3e8b"></div><div class="name">Purple Deep</div><div class="hex">#4C3E8B</div></div>
  </div>
</body>
</html>
