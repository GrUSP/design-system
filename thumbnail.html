<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="styles.css" />
<style>
  html,body{margin:0;width:1280px;height:854px;overflow:hidden;font-family:var(--font-body)}
  .tile{position:relative;width:1280px;height:854px;display:flex}
  .main{flex:1;background:var(--grusp-purple-deep);display:flex;align-items:center;justify-content:center}
  .main img{max-width:62%;max-height:52%;object-fit:contain}
  .strip{width:140px;display:flex;flex-direction:column}
  .strip div{flex:1}
</style>
</head>
<body>
<div class="tile">
  <div class="main"><img src="assets/logos/grusp-squared.png" alt="GrUSP" /></div>
  <div class="strip">
    <div style="background:var(--grusp-purple)"></div>
    <div style="background:var(--grusp-purple-deep)"></div>
    <div style="background:var(--grusp-yellow)"></div>
    <div style="background:var(--grusp-black)"></div>
  </div>
</div>
</body>
</html>
