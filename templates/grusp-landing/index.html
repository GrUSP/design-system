<!-- @template name="Conference landing" description="Single-event GrUSP landing page — accent hero, line-up, tickets CTA" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>reactjsday 2026 — GrUSP</title>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="./ds-base.js"></script>
<style>
  /* --accent: pick any conference token, e.g. var(--c-reactjsday) */
  :root { --accent: var(--c-reactjsday); }
  body { margin: 0; font-family: var(--font-body); color: var(--text-body); background: var(--surface-page); }
  .nav { display: flex; align-items: center; justify-content: space-between; padding: 16px clamp(20px,5vw,64px); border-bottom: 2px solid var(--grusp-black); position: sticky; top: 0; background: rgba(255,255,255,.9); backdrop-filter: blur(10px); z-index: 5; }
  .nav img { height: 30px; }
  .nav__links { display: flex; gap: 22px; font-weight: 700; font-size: 14px; }
  .nav__links a { color: var(--text-strong); text-decoration: none; cursor: pointer; }
  .hero { background: var(--accent); color: #fff; padding: clamp(48px,7vw,104px) clamp(20px,5vw,64px); }
  .hero__in { max-width: 1200px; margin: 0 auto; display: grid; grid-template-columns: 1.6fr 1fr; gap: 48px; align-items: center; }
  .hero__kick { font-family: var(--font-mono); font-weight: 700; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; background: rgba(0,0,0,.22); display: inline-block; padding: 6px 12px; border-radius: 999px; }
  .hero h1 { font: var(--fw-black) clamp(56px,9vw,128px)/.9 var(--font-display); letter-spacing: -.04em; text-transform: lowercase; margin: 18px 0 16px; color: #fff; }
  .hero p { font-size: 20px; line-height: 1.5; max-width: 30em; opacity: .95; margin: 0 0 28px; }
  .hero__meta { display: flex; gap: 26px; font-weight: 700; margin-bottom: 30px; }
  .hero__cta { display: flex; gap: 12px; flex-wrap: wrap; }
  .ticket { background: #fff; color: var(--text-body); border: 3px solid var(--grusp-black); border-radius: var(--radius-xl); padding: 28px; box-shadow: var(--offset-lg); }
  .ticket b { font-family: var(--font-cond); font-weight: 800; font-size: 60px; display: block; line-height: .9; }
  .section { max-width: 1200px; margin: 0 auto; padding: clamp(48px,6vw,88px) clamp(20px,5vw,64px); }
  .section h2 { font: var(--fw-extrabold) clamp(30px,4vw,46px)/1.05 var(--font-display); letter-spacing: -.02em; margin: 0 0 28px; }
  .grid { display: grid; grid-template-columns: repeat(2,1fr); gap: 18px; }
  .foot { background: var(--grusp-black); color: #fff; text-align: center; padding: 48px 20px; }
  .foot h2 { font: var(--fw-black) clamp(28px,4vw,52px)/1 var(--font-display); color: #fff; margin: 0 0 20px; }
  @media (max-width: 820px){ .hero__in, .grid { grid-template-columns: 1fr; } .nav__links { display: none; } }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
function waitForDS(cb){
  const ns = window.GrUSPDesignSystem_705bf7;
  if (ns && ns.Button) return cb(ns);
  setTimeout(() => waitForDS(cb), 40);
}
waitForDS((DS) => {
  const { Button, SpeakerCard, Badge } = DS;
  const base = '../..';
  const speakers = [
    { name:"Chiara Salvatore", role:"Frontend Engineer", company:"Olo", talk:"Designing for the next billion devices" },
    { name:"Lara Lombardi", role:"Staff Engineer", company:"Nearform", talk:"Streaming SSR without the tears" },
    { name:"Daniel Londero", role:"Principal Engineer", company:"Sourcesense", talk:"Edge runtimes: cold starts & all" },
    { name:"Matteo Beccati", role:"Core maintainer", company:"PostgreSQL", talk:"Postgres for frontend devs" },
  ];
  function Page(){
    return (
      <div>
        <nav className="nav">
          <img src={base + "/assets/logos/grusp-primary-h-catright.png"} alt="GrUSP" />
          <div className="nav__links"><a>Speakers</a><a>Schedule</a><a>Venue</a><a>Tickets</a></div>
          <Button variant="accent" size="sm">Get tickets</Button>
        </nav>
        <header className="hero">
          <div className="hero__in">
            <div>
              <span className="hero__kick">// 13th edition · made in italy</span>
              <h1>reactjsday</h1>
              <p>Two days on React and the modern frontend, with the people building it in production.</p>
              <div className="hero__meta"><span>📅 23–24 Oct 2026</span><span>📍 Verona, IT</span></div>
              <div className="hero__cta">
                <Button variant="accent" size="lg">Get your ticket</Button>
                <Button variant="secondary" size="lg">Submit a talk</Button>
              </div>
            </div>
            <div className="ticket">
              <span style={{fontWeight:700,fontSize:13,letterSpacing:".06em",textTransform:"uppercase",color:"var(--text-subtle)"}}>Blind-bird from</span>
              <b>€149</b>
              <p style={{fontSize:13,color:"var(--danger)",fontWeight:700,margin:"4px 0 16px"}}>Ends in 12 days</p>
              <Button variant="primary" size="md" block>Buy now</Button>
            </div>
          </div>
        </header>
        <section className="section">
          <Badge variant="purple">The line-up</Badge>
          <h2 style={{marginTop:14}}>Speakers</h2>
          <div className="grid">
            {speakers.map(s => <SpeakerCard key={s.name} {...s} interactive />)}
          </div>
        </section>
        <footer className="foot">
          <h2>See you in Verona?</h2>
          <Button variant="accent" size="lg">Get your ticket</Button>
        </footer>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById("root")).render(<Page/>);
});
</script>
</body>
</html>
